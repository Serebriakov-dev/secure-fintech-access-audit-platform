spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=audit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.serebriakov.fintech.events.audit
spring.kafka.consumer.properties.spring.json.value.default.type=dev.serebriakov.fintech.events.audit.AuditEvent

app.kafka.topics.audit-events=audit-events