spring.datasource.url=${ACCESS_DB_URL:jdbc:postgresql://localhost:5432/access_db}
spring.datasource.username=${ACCESS_DB_USERNAME:access_service}
spring.datasource.password=${ACCESS_DB_PASSWORD:access_service}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/secure-fintech}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/secure-fintech/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences[0]=${KEYCLOAK_AUDIENCE:access-service}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topics.audit-events=audit-events
